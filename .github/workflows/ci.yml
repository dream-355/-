name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall -q backend scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Frontend module presence
        run: |
          test -f frontend/assets/app.js
          test -f frontend/assets/modules/deps.js
          test -f frontend/assets/sw.js
          test -f frontend/assets/manifest.webmanifest
